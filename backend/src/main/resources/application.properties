spring.application.name=college-event-management-system
server.port=${PORT:8080}

# Database Configuration (MySQL with Resilient Fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/college_event_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (Stateless authentication for REST API)
app.jwt.secret=${JWT_SECRET:CollegeEventManagementSystemSecretKey2026SecureLongKeyForHMACSHA256Signature!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Server & Multipart Configuration
server.servlet.context-path=/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# High Concurrency & Multi-User Optimization (Supports 300+ concurrent members without lag)
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=50
server.tomcat.accept-count=500
server.tomcat.max-connections=10000
server.tomcat.connection-timeout=20000

# HikariCP Connection Pool Optimization for High Throughput
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# HTTP Compression (Reduces bandwidth and network latency by up to 75%)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Logging Configuration
logging.level.root=INFO
logging.level.com.college.event=INFO
