<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Events | College Event Management System</title>
  <link rel="stylesheet" href="/css/taste-theme.css">
  <style>
    .filter-bar {
      margin: var(--space-6) auto;
      max-width: var(--container-max);
      padding: 0 var(--space-6);
    }
    .filter-card {
      background: var(--bg-surface);
      border: var(--border-glass);
      border-radius: var(--radius-xl);
      padding: var(--space-4) var(--space-6);
      backdrop-filter: var(--blur-md);
      -webkit-backdrop-filter: var(--blur-md);
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-4);
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }
    .search-inputs {
      display: flex;
      gap: var(--space-3);
      flex: 1;
      max-width: 650px;
    }
  </style>
</head>
<body>

  <!-- Floating Glass Tab Navigation -->
  <div class="glass-nav-wrapper">
    <nav class="navbar">
      <div class="navbar-container">
        <a href="/index.html" class="navbar-brand">
          <span>CollegeEvents</span>
          <span class="brand-badge">Explore</span>
        </a>

        <ul class="glass-tabs">
          <li class="glass-tab-item"><a href="/index.html">Home</a></li>
          <li class="glass-tab-item"><a href="/pages/events.html" class="active">Browse Events</a></li>
          <li class="glass-tab-item"><a href="/pages/about.html">About</a></li>
          <li class="glass-tab-item"><a href="/pages/contact.html">Contact</a></li>
        </ul>

        <div class="navbar-actions" id="navbar-auth-actions"></div>
      </div>
    </nav>
  </div>

  <!-- Header -->
  <header style="max-width: var(--container-max); margin: var(--space-6) auto 0; padding: 0 var(--space-6); position: relative; z-index: 1;">
    <h1 style="color:#ffffff;">Explore Campus Events</h1>
    <p>Discover competitions, workshops, symposiums, and festivals scheduled across departments.</p>
  </header>

  <!-- Glass Filter & Search Bar -->
  <div class="filter-bar">
    <div class="filter-card">
      <div class="search-inputs">
        <input type="text" id="searchInput" class="form-control" placeholder="Search by event title, venue, or keywords..." />
        <select id="categoryFilter" class="form-select" style="max-width: 200px;">
          <option value="">All Categories</option>
          <option value="Technical">Technical</option>
          <option value="Cultural">Cultural</option>
          <option value="Workshop">Workshop</option>
          <option value="Sports">Sports</option>
          <option value="Seminar">Seminar</option>
        </select>
      </div>
      <div style="display: flex; gap: var(--space-2);">
        <button class="btn btn-primary btn-sm btn-pill" onclick="applyFilters()">Filter Events</button>
        <button class="btn btn-secondary btn-sm btn-pill" onclick="resetFilters()">Reset</button>
      </div>
    </div>
  </div>

  <!-- Events Container -->
  <main style="max-width: var(--container-max); margin: 0 auto; padding: var(--space-6) var(--space-6) var(--space-12); flex: 1; position: relative; z-index: 1;">
    <div class="events-grid" id="events-list-grid">
      <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--ink-secondary);">
        Fetching events from database...
      </div>
    </div>
  </main>

  <footer>
    <div style="max-width: var(--container-max); margin: 0 auto; text-align: center;">
      <strong style="color:#ffffff;">College Event Management System</strong> • Premium Glass Tab UI
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/notifications.js"></script>
  <script>
    async function loadEvents(keyword = '', category = '') {
      const container = document.getElementById('events-list-grid');
      container.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--ink-secondary);">Loading events...</div>';
      
      try {
        const res = await Api.events.search(keyword, category);
        const events = res.data || [];

        if (events.length === 0) {
          container.innerHTML = `
            <div style="grid-column: 1 / -1; text-align: center; padding: 4rem; background: var(--bg-surface); border: var(--border-glass); border-radius: var(--radius-xl); backdrop-filter: var(--blur-md);">
              <h3 style="color:#ffffff;">No events found</h3>
              <p style="margin-top: 0.5rem;">Try adjusting your keyword or category filters.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = events.map(event => `
          <div class="event-card">
            <img src="${event.imageUrl || 'https://images.unsplash.com/photo-1540575467063-178a50c2df87?auto=format&fit=crop&w=800&q=80'}" alt="${event.title}" class="event-card-img" />
            <div class="event-card-body">
              <div class="event-card-meta">
                <span class="badge badge-active">${event.category}</span>
                <span>Date: ${event.eventDate}</span>
                <span>Time: ${event.eventTime}</span>
              </div>
              <h3 class="event-card-title">${event.title}</h3>
              <p class="event-card-desc">${event.description}</p>
              
              <div style="font-size: 0.8rem; color: var(--ink-secondary); margin-top: auto; display: flex; flex-direction: column; gap: 0.25rem;">
                <div><strong>Venue:</strong> ${event.venue}</div>
                <div><strong>Deadline:</strong> ${new Date(event.registrationDeadline).toLocaleDateString()}</div>
              </div>
            </div>
            <div class="event-card-footer">
              <span style="font-size: 0.8rem; font-weight: 600; color: ${event.full ? '#f87171' : '#38bdf8'};">
                ${event.full ? 'Capacity Full' : `${event.currentRegistrations} / ${event.maxCapacity} Seats`}
              </span>
              <a href="/pages/event-details.html?id=${event.id}" class="btn btn-primary btn-sm btn-pill">
                ${event.full ? 'View Details' : 'Register Now →'}
              </a>
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<div style="grid-column: 1 / -1; color: #f87171; padding: 2rem; text-align: center;">Error loading events: ${err.message}</div>`;
      }
    }

    function applyFilters() {
      const keyword = document.getElementById('searchInput').value;
      const category = document.getElementById('categoryFilter').value;
      loadEvents(keyword, category);
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('categoryFilter').value = '';
      loadEvents();
    }

    document.getElementById('searchInput').addEventListener('keyup', (e) => {
      if (e.key === 'Enter') applyFilters();
    });

    loadEvents();
  </script>
</body>
</html>
